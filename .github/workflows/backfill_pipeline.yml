name: Backfill Feature Pipeline

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-backfill-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Global 1-Year Backfill Script & Sync to W&B
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          python scripts/backfill_global_capitals.py
          python scripts/sync_to_wandb.py

      - name: Upload Historical Dataset Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-aqi-dataset
          path: data/historical_aqi_features.csv
          if-no-files-found: ignore
          retention-days: 14
