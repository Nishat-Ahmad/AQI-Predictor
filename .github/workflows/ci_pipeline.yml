name: CI / Backend Smoke Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and Verify All Python Modules
        run: |
          python -m py_compile backend/*.py models/*.py scripts/*.py

      - name: Test FastAPI App Initialization & Schemas
        run: |
          python -c "
          from backend.main import app
          from backend.schemas import EnvironmentalInput, PredictionResponse, ForecastResponse
          from backend.model_service import model_service
          preds = model_service.predict({'pm2_5': 25.0, 'pm10': 40.0, 'no2': 15.0, 'o3': 30.0, 'co': 500.0, 'hour': 12, 'day': 18, 'month': 8, 'day_of_week': 1})
          print('Model predictions verified:', preds)
          print('FastAPI app, models, and schemas verified successfully.')
          "
