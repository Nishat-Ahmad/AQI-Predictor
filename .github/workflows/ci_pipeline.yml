name: CI / Backend Smoke Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile and Verify All Python Modules
        run: |
          python -m py_compile backend/*.py models/*.py scripts/*.py

      - name: Test FastAPI App Initialization & Schemas
        run: |
          python -c "
          from backend.main import app
          from backend.schemas import EnvironmentalInput, PredictionResponse
          print('FastAPI app and schemas verified successfully.')
          "
