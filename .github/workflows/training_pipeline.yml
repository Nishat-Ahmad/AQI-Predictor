name: Daily Model Training & Benchmarking

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 2:00 AM UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-training-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements-dev.txt'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Prepare Historical Feature Store Dataset
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          python -c "
          import os
          from scripts.backfill_global_capitals import run_global_backfill
          run_global_backfill()
          "

      - name: Benchmark & Retrain All Multi-Horizon Models
        env:
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          python models/compare_models.py
          python models/randomForest.py
          python models/ridge_regression.py
          python models/deep_learning.py
          python scripts/sync_to_wandb.py

      - name: Upload Trained Model Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trained-aqi-models
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 30
