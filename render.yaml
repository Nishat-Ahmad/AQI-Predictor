services:
  - type: web
    name: aqi-predictor-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: WANDB_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
